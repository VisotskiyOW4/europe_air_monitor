<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Глобальна система моніторингу</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map {
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Global Env Monitoring</a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/air/">Повітря</a></li>
                <li class="nav-item"><a class="nav-link" href="/water/">Вода</a></li>
                <li class="nav-item"><a class="nav-link" href="/soil/">Грунт</a></li>
                <li class="nav-item"><a class="nav-link" href="/radiation/">Радіація</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container flex-grow-1">
    {% block content %}{% endblock %}
</main>

<footer class="bg-light text-center text-muted py-2 mt-auto">
    <small>2025 Global Environment Monitoring System</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

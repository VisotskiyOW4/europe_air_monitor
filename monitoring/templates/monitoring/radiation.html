{% extends "monitoring/base.html" %}
{% block content %}

<h2 class="text-center">Радіаційний фон</h2>
<div id="map"></div>

<script>
fetch("/radiation/data/")
    .then(r => r.json())
    .then(data => {
        let map = L.map("map").setView([50.45, 30.52], 5);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {}).addTo(map);

        data.forEach(p => {
            L.marker([p.latitude, p.longitude])
                .addTo(map)
                .bindPopup(`
                    <b>${p.name}</b><br>
                    Gamma: ${p.gamma}<br>
                    Beta: ${p.beta}<br>
                    Alpha: ${p.alpha}<br>
                    Доза: ${p.ambient_dose_rate}<br>
                    Час: ${p.timestamp}
                `);
        });
    });
</script>

{% endblock %}

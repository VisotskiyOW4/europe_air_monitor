<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Глобальний моніторинг навколишнього середовища</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet AwesomeMarkers -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.awesome-markers/dist/leaflet.awesome-markers.css"/>
  <script src="https://unpkg.com/leaflet.awesome-markers/dist/leaflet.awesome-markers.js"></script>

  <style>
    #map {
      width: 100%;
      height: 650px;
      border-radius: 10px;
    }
    body {
      font-family: "Segoe UI", sans-serif;
    }
    .legend {
      background: white;
      line-height: 1.5em;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Global EnviroMonitor</a>
  </div>
</nav>

<main class="flex-grow-1">
  <div class="container my-4">
    <h2 class="text-center mb-3">Система глобального моніторингу навколишнього середовища</h2>
    <div id="map"></div>
  </div>
</main>

<footer class="bg-light text-center text-muted py-2 mt-auto">
  <small>2025 Система глобального моніторингу навколишнього середовища</small>
</footer>

<script>
  // Ініціалізація карти
  const map = L.map('map', {center: [48, 10], zoom: 4});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Створюємо різні групи шарів
  const airLayer = L.layerGroup();
  const waterLayer = L.layerGroup();
  const soilLayer = L.layerGroup();
  const radiationLayer = L.layerGroup();

  // Кольори для маркерів
  const icons = {
    air: L.AwesomeMarkers.icon({icon: 'cloud', markerColor: 'blue', prefix: 'fa'}),
    water: L.AwesomeMarkers.icon({icon: 'tint', markerColor: 'cadetblue', prefix: 'fa'}),
    soil: L.AwesomeMarkers.icon({icon: 'leaf', markerColor: 'green', prefix: 'fa'}),
    radiation: L.AwesomeMarkers.icon({icon: 'radiation', markerColor: 'red', prefix: 'fa'})
  };

  // ====== ПОВІТРЯ ======
  fetch('/air/data/')
    .then(res => res.json())
    .then(data => {
      data.forEach(station => {
        const popup = `
          <b>${station.name}</b><br>
          PM2.5: ${station.pm25 ?? 'N/A'}<br>
          PM10: ${station.pm10 ?? 'N/A'}<br>
          CO: ${station.co ?? 'N/A'}<br>
          NO₂: ${station.no2 ?? 'N/A'}<br>
          O₃: ${station.o3 ?? 'N/A'}<br>
          AQI: ${station.aqi ?? 'N/A'} (${station.status ?? '-'})
        `;
        L.marker([station.latitude, station.longitude], {icon: icons.air}).bindPopup(popup).addTo(airLayer);
      });
    });

  // ====== ВОДА ======
  fetch('/water/data/')
    .then(res => res.json())
    .then(data => {
      data.forEach(station => {
        const popup = `
          <b>${station.name}</b><br>
          pH: ${station.ph ?? 'N/A'}<br>
          Нітрати: ${station.nitrates ?? 'N/A'}<br>
          Каламутність: ${station.turbidity ?? 'N/A'}<br>
          Температура: ${station.temperature ?? 'N/A'}°C<br>
          Індекс: ${station.index ?? 'N/A'}
        `;
        L.marker([station.latitude, station.longitude], {icon: icons.water}).bindPopup(popup).addTo(waterLayer);
      });
    });

  // ====== ҐРУНТ ======
  fetch('/soil/data/')
    .then(res => res.json())
    .then(data => {
      data.forEach(station => {
        const popup = `
          <b>${station.name}</b><br>
          Важкі метали: ${station.heavy_metals ?? 'N/A'}<br>
          Пестициди: ${station.pesticides ?? 'N/A'}<br>
          Вологість: ${station.moisture ?? 'N/A'}<br>
          Індекс родючості: ${station.fertility_index ?? 'N/A'}<br>
          Ризик: ${station.risk ?? 'N/A'}
        `;
        L.marker([station.latitude, station.longitude], {icon: icons.soil}).bindPopup(popup).addTo(soilLayer);
      });
    });

  // ====== РАДІАЦІЯ ======
  fetch('/radiation/data/')
    .then(res => res.json())
    .then(data => {
      data.forEach(station => {
        const popup = `
          <b>${station.name}</b><br>
          Гамма: ${station.gamma ?? 'N/A'}<br>
          Бета: ${station.beta ?? 'N/A'}<br>
          Альфа: ${station.alpha ?? 'N/A'}<br>
          Дозова потужність: ${station.dose_rate ?? 'N/A'}<br>
          Ризик: ${station.risk ?? 'N/A'}
        `;
        L.marker([station.latitude, station.longitude], {icon: icons.radiation}).bindPopup(popup).addTo(radiationLayer);
      });
    });

  // Додаємо всі шари на карту
  const layers = {
    "Якість повітря": airLayer,
    "Якість води": waterLayer,
    "Ґрунт": soilLayer,
    "Радіаційний фон": radiationLayer
  };

  L.control.layers(layers, null, {collapsed: false}).addTo(map);

  // Додаємо легенду
  const legend = L.control({position: 'bottomright'});
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <b>Легенда:</b><br>
      <i class="fa fa-cloud" style="color:#2A81CB"></i> Повітря<br>
      <i class="fa fa-tint" style="color:#2CA25F"></i> Вода<br>
      <i class="fa fa-leaf" style="color:#66A61E"></i> Ґрунт<br>
      <i class="fa fa-radiation" style="color:#E31A1C"></i> Радіація
    `;
    return div;
  };
  legend.addTo(map);
</script>

</body>
</html>

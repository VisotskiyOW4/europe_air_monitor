{% extends "monitoring/base.html" %}
{% load static %}

{% block content %}
<style>
    #chart-wrapper {
        height: 380px;
        padding: 10px;
    }
    #historyChart {
        width: 100% !important;
        height: 100% !important;
    }
    /* Правий блок - компактніше */
    #station-details ul {
        padding-left: 18px;
        margin-bottom: 6px;
    }
    #station-details li {
        margin-bottom: 4px;
    }
</style>

<div class="container-fluid">
    <h2 class="text-center my-4">Система глобального моніторингу навколишнього середовища</h2>

    <div class="row">

        <!-- Ліва частина: мапа + графік -->
        <div class="col-lg-9 col-md-8">

            <!-- Мапа -->
            <div id="map" style="height: 650px; border-radius: 10px;"></div>

            <!-- Графік під картою -->
            <div class="card p-3 mt-3">
                <h5 class="fw-bold mb-3">Динаміка показників</h5>

                <div class="btn-group btn-group-sm mb-2" id="chart-mode-global">
                    <button type="button" class="btn btn-primary active" data-mode="history">Історія</button>
                    <button type="button" class="btn btn-outline-primary" data-mode="forecast">Прогноз</button>
                </div>

                <!-- Вибір горизонту прогнозу -->
                <div class="btn-group btn-group-sm mb-2 w-100" id="days-selector">
                    <button type="button" class="btn btn-primary active" data-days="3">3 дні</button>
                    <button type="button" class="btn btn-outline-secondary" data-days="7">7 днів</button>
                    <button type="button" class="btn btn-outline-secondary" data-days="30">30 днів</button>
                </div>

                <div id="chart-wrapper">
                    <canvas id="historyChart"></canvas>
                </div>
            </div>

        </div>

        <!-- Права панель -->
        <div class="col-lg-3 col-md-4">

            <!-- Вибір дати -->
            <div class="card p-2 mb-3">
                <label class="fw-bold" for="global-date">Дата:</label>
                <input type="date" class="form-control form-control-sm" id="global-date" lang="uk">
                <button class="btn btn-sm btn-primary w-100 mt-2" id="apply-global-filter">
                    Показати дані
                </button>
            </div>

            <!-- Вибір шару -->
            <div class="card p-3 mb-3">
                <h5 class="fw-bold">Обраний шар</h5>

                <label><input type="radio" name="layer" value="air" checked> Якість повітря</label><br>
                <label><input type="radio" name="layer" value="water"> Якість води</label><br>
                <label><input type="radio" name="layer" value="soil"> Ґрунт</label><br>
                <label><input type="radio" name="layer" value="radiation"> Радіаційний фон</label>
            </div>

            <!-- Деталі станції -->
            <div class="card p-3 mb-3" id="station-details">
                <h5 class="fw-bold">Детальна інформація про станцію</h5>
                <div class="text-muted">Виберіть станцію на мапі…</div>
            </div>

        </div>
    </div>
</div>
{% block extra_js %}
<script src="{% static 'monitoring/js/global_map.js' %}?v={% now 'U' %}"></script>
{% endblock %}
{% endblock %}

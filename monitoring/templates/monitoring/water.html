{% extends "monitoring/base.html" %}
{% block content %}

<h2 class="text-center">Моніторинг якості води</h2>
<div id="map"></div>

<script>
fetch("/water/data/")
    .then(r => r.json())
    .then(data => {
        let map = L.map("map").setView([50.45, 30.52], 5);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {}).addTo(map);

        data.forEach(p => {
            L.marker([p.latitude, p.longitude])
                .addTo(map)
                .bindPopup(`
                    <b>${p.name}</b><br>
                    pH: ${p.ph}<br>
                    Нітрати: ${p.nitrates}<br>
                    Провідність: ${p.conductivity}<br>
                    Час: ${p.timestamp}
                `);
        });
    });
</script>

{% endblock %}
